name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The Worker and its tests have no dependencies, so nothing needs installing.
      - name: Syntax check
        run: node --check src/index.js

      - name: Unit tests
        run: node --test test/*.test.js

  wrangler:
    name: Validate wrangler.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dry-run build
        run: npx --yes wrangler@4 deploy --dry-run --outdir=dist
